<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="register.css">
    <script src="https://cdn.jsdelivr.net/npm/validator@13.9.0/validator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</head>
<body>



  <div id="alertContainer" class="alert d-none" role="alert"></div>


  <div class="container1">


    <h3>Sign Up</h3>
   
          

     <form id="registerForm">
                <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Name</label>
                  <input type="text" class="form-control" id="username" >
                 
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                   
                  </div>

                  <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Phone</label>
                    <input type="text" class="form-control" id="phone" aria-describedby="emailHelp">
                   
                  </div>

                <div class="mb-3">
                  <label for="exampleInputPassword1" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password"  style="margin-bottom: 40px;">
                </div>
                <select class="form-select" aria-label="Default select example" style="margin-bottom: 30px;" id="role">
                  
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                   
                  </select>



                

                


                <button type="submit" class="btn btn-primary" id="btnSignup">SignUp</button>


                <div class="mb-3 form-check" style="margin-top: 20px;">
                 
                  <label class="container" class="form-check-label" for="exampleCheck1" style="margin-top: 15px;">Have an account?  <a href="Login.html">Login Here</a></label>
                </div>
              </form>

        </div>

        <script>

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    if (validator.isEmpty(username)) {
        return showSwal('Name is required', 'error');
    }

    if (!validator.isEmail(email)) {
        return showSwal('Invalid email address', 'error');
    }

    if (!/^\d{9,10}$/.test(phone)) {
        return showSwal('Phone number must be 9 or 10 digits', 'error');
    }

    if (!validator.isLength(password, { min: 6 })) {
        return showSwal('Password must be at least 6 characters', 'error');
    }


    try {
        const response = await fetch('http://localhost:9000/registerUser', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, phone, password, role }),
             credentials: 'same-origin'
        });

        const data = await response.json();

        if (response.ok) {
          showSwal(` ${data.message}`,`success`);
            registerForm.reset();
            
        } else {
          showSwal(` ${data.message}`, 'error');
        }
    } catch (error) {
          showSwal(`Network Error: ${error.message}`, 'error');
        console.error("Fetch error:", error);
    }
});


function showSwal(message, iconType) {
    Swal.fire({
        icon: iconType, 
        title: iconType === 'success' ? 'Success' : 'Error',
        text: message,
        timer: 7000,
        timerProgressBar: true,
        showConfirmButton: false,
        position: 'top-center',
    });
}

         
        </script>
  
</body>
</html>
