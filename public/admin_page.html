       <div class="form">
         <h1 class="title">Admin - Manage Products</h1>
        <form id="product-form" action="" enctype="multipart/form-data">

            <label for="">Product Name</label>
            <input type="text" name="name" id="name" required>

            <label for="">Description</label>
            <input type="text" name="description" id="description" required>

            <label for="">Price</label>
            <input type="number" name="price" id="price" required>

            <label for="">stock</label>
            <input type="number" name="stock" id="stock" required>

            <label for="">ID Category</label>
            <input type="number" name="id_categorie" id="id_categorie" required>

            <label for="">Iamge Product</label>
            <input type="file" name="img_product" id="img_product"  accept="image/*" required>

            <button type="submit" class="btn btn-primary">Add Product</button>
        </form>

    <h2>Existing Products</h2>
  <table class="table table-bordered table-hover mt-3">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Product Image</th>
        <th>created At</th>
        <th>Updated At</th>
        <th>ID Category</th>
        <th>Actions</th>
      </tr>
    </thead>

    </tbody>

  <script>
    


    let ID_Product = null; 

document.getElementById('product-form').addEventListener('submit', function (e) {
  e.preventDefault();

  const form = e.target;
  const formData = new FormData(form);

  if (ID_Product === null) {
     
    fetch('http://localhost:9000/AddProduct', {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
    
      if (data.success) {
        showSwal(`${data.message}`,'success');
        form.reset();
        DisplayProductsData();
      }else{
        showSwal(`${data.message}`,'error');
      }
    });

  } else {
    formData.append('id_product', ID_Product); 

    fetch('http://localhost:9000/UpdateProduct', {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
    
      if (data.success) {
        form.reset();
        ID_Product = null; 
        document.querySelector('button[type="submit"]').textContent = 'Add Product';
        DisplayProductsData();
        showSwal(`${data.message}`,'success');
      }else{
        showSwal(`${data.message}`,'error');
      }
    });
  }
});



    function DisplayProductsData() {
  fetch('http://localhost:9000/GetAllProducts')
    .then(response => response.json())
    .then(data => {
      console.log("Data received:", data);

      const tbody = document.querySelector('tbody');
      tbody.innerHTML = "";

      if (data.products && Array.isArray(data.products)) {
        data.products.forEach(product => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${product.id_product || ''}</td>
            <td>${product.name || ''}</td>
            <td>${product.description || ''}</td>
            <td>${product.price || ''}</td>
            <td>${product.stock || ''}</td>
            <td>
              ${product.img_product ? `<img src="${product.img_product.replaceAll('\\', '/')}" width="50" height="50" />` : 'No Image'}
            </td>
            <td>${product.created_date || ''}</td>
            <td>${product.updated_date || ''}</td>
            <td>${product.id_categorie || ''}</td>
            <td class="action-buttons">
              <button onclick="EditProduct(${product.id_product})" class="btn btn-sm btn-warning">Edit</button>
              <button onclick="DeleteProduct(${product.id_product})" class="btn btn-sm btn-danger delete">Delete</button>
            </td>
          `;
          tbody.appendChild(row);
        });
       
      } else {
        showSwal('no peoducts found','error');
      }
    })
    .catch(error => {
      console.error("Error fetching products:", error);
    });
}





//DisplayProductsData();

function DeleteProduct(id) {
  console.log("DeleteProduct called with ID:", id);

  fetch(`http://localhost:9000/DeleteProduct`, {
    method: 'DELETE',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ id })
  })
 
  .then(response => response.json())
  .then(data => {
    console.log("Delete response:", data);
    if (data.success) {
      showSwal(`${data.message}`,'success');
      DisplayProductsData(); 
      window.onload;
      
     
    } else {
      showSwal(`${data.message}`,'error');
    }
  })
  .catch(error => {
    console.error("Error deleting product:", error);
  });
}



function EditProduct(id){
  fetch(`http://localhost:9000/GetProductById/${id}`)
  .then(response => response.json())
  .then(data =>{
    if(data.success){
      const product = data.product;
      document.getElementById('name').value = product.name;
      document.getElementById('description').value = product.description;
        document.getElementById('price').value = product.price;
        document.getElementById('stock').value = product.stock;
        document.getElementById('id_categorie').value = product.id_categorie;
        ID_Product = product.id_product;
        document.querySelector('button[type="submit"]').textContent = 'Update Product';

      
    }else{
      alert(data.message);
    }
  });

}

function showSwal(message, iconType) {
    Swal.fire({
        icon: iconType, // success or error
        title: iconType === 'success' ? 'Success' : 'Error',
        text: message,
        timer: 7000,
        timerProgressBar: true,
        showConfirmButton: false,
        position: 'top',
    });
}
window.onload = DisplayProductsData;
