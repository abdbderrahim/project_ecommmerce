<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="DataCardStyle.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/validator@13.9.0/validator.min.js"></script>
    
   
</head>
<body>
    <div class="container">
        <div class="box1">
            <h5>ADDRESS CLIENT</h5>
            <HR></HR>

            <form action="">
                <div class="form">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
               
              </div>


              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
               
              </div>
            </div>

               <div class="form">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Address</label>
                <input type="text" class="form-control" id="address"  required>
               
              </div>


              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Number Phone</label>
                <input type="number" class="form-control" id="phone" required >
               
              </div>
            </div>


            <div class="form">


              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Zipe Code</label>
                <input type="text" class="form-control" id="zipcode" required>
               
              </div>

              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Country</label>
                <input type="text" class="form-control" id="country" required >
               
              </div>
            </div>

           


        
           
          <h6> <img src="slide/privacy.png" alt="">&nbspProvide further information <br> Your payment information is safe with us</h6>
           <hr>
          

           <div class="form">
           <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Card Number</label>
            <input type="number" class="form-control" id="cardNumber" required>
           
          </div>
         

          
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Date Expiry</label>
            <input type="date" class="form-control" id="cardExpiry" required>
           
          </div>
        </div>
         
          <div class="cvv">
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">CVV</label>
            <input type="number" class="form-control" id="cardCvv" required>
        </div>
           
          </div>
        </form>

          <button type="submit"  id="Confirm" class="btn btn-primary">Confirm</button>

        </div>

        <div class="box2">
            <h4>Order summary</h4>
            <br>
            <hr>
            
            <label for="">Shipping fee: &nbsp &nbsp &nbsp &nbsp <span id="shippingFee">$9.00</span></label>
            <hr>
           
            
           
           <label for="totalArticles" class="form-label">Total Articls: &nbsp  &nbsp &nbsp &nbsp &nbsp<span  id="totalArticles">$00.00</span></label>
           <hr>


           <label for="totalArticles" class="form-label">Total price: &nbsp  &nbsp &nbsp &nbsp &nbsp<span  id="totalPrice">$00.00</span></label>
           <hr>
           
          
           <label for="totalAmount" class="form-label">Total Amount:  &nbsp &nbsp &nbsp &nbsp<span  id="totalAmount">$00.00</span></label>
           <hr>
           
           
           
         
            <div class="total">
             
       
    
        <button type="submit"  id="btnOrder" class="btn btn-primary" >Place Order</button>
            </div>
            <div class="paraOrder">
               <p></p>
            </div>
        </div>


    </div>

    <script>
      const cart = localStorage.getItem('cart');
    
      if (cart) {
        const cartorder = JSON.parse(cart);
    
        let totalArticles = 0;
        let totalAmount = 0;
        let totalPrice = 0;
    
        cartorder.forEach(item => {
          totalArticles += item.quantity;
          totalAmount += item.price * item.quantity;
          totalPrice += item.price * item.quantity;
        });
    
        const shippingFee = 9.00;
        const finalAmount = totalAmount + shippingFee;
    
        document.getElementById("shippingFee").textContent = `$${shippingFee.toFixed(2)}`;
        document.getElementById("totalArticles").textContent = totalArticles;
        document.getElementById("totalPrice").textContent = totalPrice;
        document.getElementById("totalAmount").textContent = `$${finalAmount.toFixed(2)}`;
      } else {
        console.log("cart is empty");
      }

      


      document.getElementById('btnOrder').addEventListener("click", async () => {
        const  cart = JSON.parse(localStorage.getItem('cart'));
        if(!cart || cart.length === 0){
          alert("cart is empty");
          return;
        }
        
      

        



        const delivery_address = document.getElementById("address").value.trim();
  const customer_first_name = document.getElementById("firstName").value.trim();
  const customer_last_name = document.getElementById("lastName").value.trim();
  const customer_phone = document.getElementById("phone").value.trim();
  const card_number = document.getElementById("cardNumber").value.trim();
  const card_expiry = document.getElementById("cardExpiry").value.trim();
  const card_cvv = document.getElementById("cardCvv").value.trim();
  const zipcode = document.getElementById("zipcode").value.trim();
  const country = document.getElementById("country").value.trim();
  const total_price = document.getElementById('totalPrice').textContent.replace("$", "");
  const total_amount = document.getElementById('totalAmount').textContent.replace("$", "");
  const payment_method = localStorage.getItem('selectedPaymentMethod');

    console.log('payment_method:',payment_method);

    const input = document.getElementById('firstName');


    if(!validator.isLength(customer_first_name, {min: 3})){
      showSwal("First name must be at least 3 characters.", "error");
      input.focus();
      input.style.border = "2px solid red ";
      input.placeholder = "*";
      input.style.placeholder.color = "red";
      
      return false;
    }

    if (!validator.isLength(customer_last_name, { min: 3 })) {
    showSwal("Last name must be at least 3 characters.", "error");
    return false;
  }

  if (!validator.isNumeric(customer_phone) || customer_phone.length < 9 || phone.length > 10) {
    showSwal("Phone number must be 9 to 10 digits.", "error");
    return false;
  }


  /*if (!validator.isCreditCard(card_number) || cardNumber.length !== 16) {
    showSwal("Card number must be 16 valid digits.", "error");
    return false;
  }*/



  if (!validator.isDate(card_expiry)) {
    showSwal("Invalid expiry date.", "error");
    return false;
  }


  if (!validator.isNumeric(zipcode) || zipcode.length !== 4) {
    showSwal("Zip code must be 4 digits.", "error");
    return false;
  }


    
    


    const data = {
      total_price,
      payment_method,
      total_amount,
      delivery_address,
      customer_first_name,
      customer_last_name,
      customer_phone,
      card_number,
      card_expiry,
      card_cvv,
      zipcode,
      country
    };



    try {
      const response = await fetch("http://localhost:9000/AddOrderAndDelivery", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify(data)
      });
      
      if(response.status === 401){
        const data = await  response.json();
        showSwal('first signup','error');
        return;
      }

      const result = await response.json();
      if (result.success) {
       showSwal(`${result.message}`,'success');
       document.querySelector("form").reset();
       
      } else {
       showSwal(`${result.message}`,'error');
      }
    } catch (error) {
      console.error("Error:", error);
      showSwal(' please signup first ','error');
     
    }


      })


      function showSwal(message, iconType) {
    Swal.fire({
        icon: iconType, // success or error
        title: iconType === 'success' ? 'Success' : 'Error',
        text: message,
        timer: 7000,
        timerProgressBar: true,
        showConfirmButton: false,
        position: 'top',
    });
}
    </script>
    
</body>
</html>
