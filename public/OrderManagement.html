    <h2>Order Management</h2>
    <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Order Date</th>
            <th>Status</th>
            <th>Total Price</th>
            <th>Payment Method</th>
            <th>Payment Date</th>
            <th>Total Amount</th>
            <th>Fcature Date</th>
            <th>ID User</th>
            <th>Actions</th>
            
          </tr>
        </thead>
        <tbody>
         
        
        </tbody>
      </table>


      <script>
        fetch('http://localhost:9000/GetAllOrders') // غيّر هذا الرابط حسب سيرفرك
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    const orders = result.data;
                    const tbody = document.querySelector("tbody");
                    tbody.innerHTML = ""; // تنظيف الجدول أولاً
    
                    orders.forEach(order => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${order.id_order}</td>
                            <td>${order.order_date}</td>
                            <td>
                                <select  onchange="updateStatus(${order.id_order}, this)">
                                    <option ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </td>
                            <td>${order.total_price}</td>
                            <td>${order.payment_method}</td>
                            <td>${order.payment_date}</td>
                            <td>${order.total_amount}</td>
                            <td>${order.facture_date}</td>
                            <td>${order.id_user}</td>
                             <td>
    <button class="btn btn-danger btn-sm" onclick="deleteOrder(${order.id_order})">
      <i class="fa fa-trash"></i> Delete
    </button>

                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    alert("error fetched orders");
                }
            })
            .catch(error => {
                console.error("error to get data", error);
            });




            
    function updateStatus(id, selectElement) {
        const selectedStatus = selectElement.value;

        fetch('http://localhost:9000/UpdateOrderStatus', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                id: id,
                status: selectedStatus
            })
        })
        .then(res => res.json())
        .then(data => {
         if(data.success){
            showSwal(`${data.message}`,'success');
         }else{
            showSwal(`${data.message}`,'error');
         }
        })
        .catch(err => {
            console.error("error to updated status order:", err);
        });
    }

    function showSwal(message, iconType) {
    Swal.fire({
        icon: iconType, 
        title: iconType === 'success' ? 'Success' : 'Error',
        text: message,
        timer: 7000,
        timerProgressBar: true,
        showConfirmButton: false,
        position: 'top-center',
    });
}



async function deleteOrder(id) {
      if (confirm('Are you sure you want to delete this order?')) {
        try {
          const response = await fetch(`http://localhost:9000/DeleteOrder/${id}`, {
            method: 'DELETE'
          });
          const result = await response.json();
          if(result.success){
            showSwal(`${result.message}`,'success');
          }else{
            showSwal(`${result.message}`,'error');
          }
          window.top.reload();
          // Reload list
        } catch (err) {
          console.error('Error deleting order:', err);
          alert('Error deleting order.');
        }
      }
    }





    </script>
