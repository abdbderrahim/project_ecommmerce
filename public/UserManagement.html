    <h2>Existing Products</h2>

  <script>
 
function DisplayProductsData(){
  fetch('http://localhost:9000/GetAllUsers')
    .then(response => response.json())
    .then(data => {
      console.log(data);
      const tbody = document.querySelector('tbody');
      tbody.innerHTML = ''; 
      if (data.users && Array.isArray(data.users)) {
      data.users.forEach(user => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${user.id_user}</td>
          <td>${user.username}</td>
          <td>${user.email}</td>
          <td>${user.phone}</td>
         
          <td>${user.role}</td>
          <td>${user.created_at}</td>
          <td>${user.updated_at}</td>
          <td>
            <button class="btn btn-sm btn-warning">Edit</button>
            <button onclick="DeleteUser(${user.id_user})" class="btn btn-sm btn-danger">Delete</button>
          </td>
        `;
        tbody.appendChild(row); 
      });
    }else{
      alert('no product found');
    }
    })
    .catch(error => {
      console.error('Error fetching users:', error);
    });
  
}

function DeleteUser(id){
  fetch('http://localhost:9000/DeleteUser', {
    method: 'delete',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({id: id})
  })

  .then(response => response.json())
  .then(data =>{
    console.log( 'data reviced',data.message);
    if(data.success){
      Swal.fire({
                icon: 'success',
                title: 'Deleted!',
                text: data.message,
                timer: 7000,
                showConfirmButton: false
            })
      window.location.reload();
    }else{

      Swal.fire({
                icon: 'error',
                title: 'Failed!',
                text: data.message,
                timer: 7000,
                showConfirmButton: false
            })
     
    }
  })
}

DisplayProductsData();
</script>
