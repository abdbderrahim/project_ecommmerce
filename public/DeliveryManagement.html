<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delivery Management</title>
  <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="DeliveryStyle.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <div class="containerr">
    <!-- Navigation -->
    <div class="nav">
      <ul class="bar">
        <li><a href="UserManagement.html"><i class="fa-solid fa-user"></i>&nbsp;&nbsp;Users</a></li>
        <li><a href="admin_page.html"><i class="fa-brands fa-product-hunt"></i>&nbsp;&nbsp;Products</a></li>
        <li><a href="CategorieManagement.html"><i class="fa-solid fa-layer-group"></i>&nbsp;&nbsp;Categories</a></li>
        <li><a href="OrderManagement.html"><i class="fa-solid fa-circle-check"></i>&nbsp;&nbsp;Orders</a></li>
        <li><a href="ProductEntries.html"><i class="fa-brands fa-stack-exchange"></i>&nbsp;&nbsp;Stock Entries</a></li>
        <li><a href="DeliveryManagement.html"><i class="fa-solid fa-truck"></i>&nbsp;&nbsp;Deliveries</a></li>
          <li><a href="indexx.html"><i class="fa-solid fa-house"></i>&nbsp;&nbsp Home</a></li>

      </ul>
    </div>

    <!-- Form -->
    <div class="form">
      <h1 class="title">Admin - Manage Deliveries</h1>
      <form id="product-form" action="" enctype="multipart/form-data">
        <label for="date">Expected Date</label>
        <input type="date" name="expected_date" id="date" required class="form-control mb-2">

        <label for="persone">Delivery Person</label>
        <input type="text" name="delivery_persone" id="persone" required class="form-control mb-3">

        <button type="submit" class="btn btn-primary">Add Delivery</button>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="container mt-4">
    <h2>Existing Deliveries</h2>
    <table class="table table-bordered table-hover mt-3">
      <thead class="table-dark">
        <tr>
          <th>ID Delivery</th>
          <th>Status</th>
          <th>Address</th>
          <th>Delivery Date</th>
          <th>Expected Date</th>
          <th>Delivery Person</th>
          <th>Order ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Phone</th>
          <th>Zipcode</th>
          <th>Country</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Script -->
  <script>
    function formatDate(isoDate) {
      if (!isoDate) return "";
      return isoDate.split("T")[0]; // YYYY-MM-DD format
    }

    function DisplayDeliveryData() {
      fetch('http://localhost:9000/GetDeliveryData')
        .then(res => res.json())
        .then(data => {
          const tbody = document.querySelector('tbody');
          tbody.innerHTML = "";
          data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${item.id_delivery}</td>
              <td>
                <select class="form-select" style="width: 140px;" id="status-${item.id_delivery}">
                  <option value="pending" ${item.delivery_status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="in progress" ${item.delivery_status === 'in progress' ? 'selected' : ''}>In Progress</option>
                  <option value="delivered" ${item.delivery_status === 'delivered' ? 'selected' : ''}>Delivered</option>
                </select>
              </td>
              <td>${item.delivery_address || ''}</td>
              <td>${item.delivery_date ? formatDate(item.delivery_date) : ''}</td>
              <td>
                <input type="date" class="form-control" style="width: 160px;" id="expected-${item.id_delivery}" value="${formatDate(item.expected_date)}">
              </td>
              <td>
                <select class="form-select" id="persone-${item.id_delivery}" style="width: 140px;">
                  <option value="Ali" ${item.delivery_person === 'Ali' ? 'selected' : ''}>Ali</option>
                  <option value="Ahmed" ${item.delivery_person === 'Ahmed' ? 'selected' : ''}>Ahmed</option>
                  <option value="Fatima" ${item.delivery_person === 'Fatima' ? 'selected' : ''}>Fatima</option>
                </select>
              </td>
              <td>${item.id_order}</td>
              <td>${item.customer_first_name}</td>
              <td>${item.customer_last_name}</td>
              <td>${item.customer_phone}</td>
              <td>${item.zipcode}</td>
              <td>${item.country}</td>
              <td>
                <button class="btn btn-sm btn-success" onclick="updateDeliveryRow(${item.id_delivery})">Save</button>
                <button class="btn btn-sm btn-warning" onclick="DeleteDelivery(${item.id_delivery})">Delete</button>
              </td>
            `;
            tbody.appendChild(row);
          });
        });
    }

    function updateDeliveryRow(id_delivery) {
      const expected_date = document.getElementById(`expected-${id_delivery}`).value;
      const delivery_person = document.getElementById(`persone-${id_delivery}`).value;
      const delivery_status = document.getElementById(`status-${id_delivery}`).value;

      fetch(`http://localhost:9000/UpdateDelivery/${id_delivery}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          expected_date,
          delivery_person,
          delivery_status
        })
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            Swal.fire('Success', 'Delivery data updated successfully', 'success');
            DisplayDeliveryData();
          } else {
            Swal.fire('Error', 'Failed to update delivery data', 'error');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          Swal.fire('Error', 'Something went wrong', 'error');
        });
    }

    function DeleteDelivery(id_delivery){
      Swal.fire({
        title: 'Are you sure?',
    text: "This delivery will be deleted!",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d33',
    cancelButtonColor: '#3085d6',
    confirmButtonText: 'Yes, delete it!'
      }).then((result) =>{
        if(result.isConfirmed){
          fetch(`http://localhost:9000/DeleteDelivery/${id_delivery}`, {
            method: 'DELETE',
          })

          .then(res => res.json())
          .then(data =>{
            if(data.success){
              Swal.fire('Deleted!', data.message, 'success');
              DisplayDeliveryData();
            }else{
              Swal.fire('Error', data.message, 'error');
            }
          })
        }
      })
      
    }

    // Load data on page load
    DisplayDeliveryData();
  </script>
</body>
</html>
