    <script>
        function DisplayCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];  
            let cartContainer = document.getElementById('cartItems');
            let cartTotal = document.getElementById('cartTotal');
            let totalAmountInput = document.getElementById('totalAmount');
            let total = 0;

            console.log("Cart loaded from localStorage:", cart); 

            if (cart.length === 0) {
                cartContainer.innerHTML = `<p <div class="text-center">
            <p>Your cart is empty.</p>
            <img src="slide/panierimg.avif" class="img-fluid" alt="Empty cart image" style="width: 200px;">
        </div>
    `;
                cartTotal.textContent = '0.00';
                totalAmountInput.value = '0.00';
                return;
            }
            cartContainer.innerHTML = "";

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;
                let card = `
                    <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
                        <div class="card" style="width: 100%;">
                            <img src="${item.image}" class="card-img-top" alt="...">
                            <div class="card-body">
                                <h5 class="card-title">${item.name}</h5>
                                <input type="number" value="${item.quantity}" id="quantity-${index}" onchange="updateQuantity(${index})">
                                <h3 class="mt-3">Total: $${itemTotal.toFixed(2)}</h3>
                                <button class="btn btn-danger mt-3"  onclick="removeCardItem(${index})" ${item.id_product}><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.innerHTML += card;
            });

            cartTotal.textContent = total.toFixed(2);
            totalAmountInput.innerHTML = total.toFixed(2);
        }

        function updateQuantity(index) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let quantityInput = document.getElementById(`quantity-${index}`);
    let newQuantity = parseInt(quantityInput.value);

    if (newQuantity <= 0 || isNaN(newQuantity)) {
        newQuantity = 1;
    }

    cart[index].quantity = newQuantity;
    localStorage.setItem('cart', JSON.stringify(cart));
    DisplayCart();
}


        document.getElementById('btnOrder').addEventListener("click", async function () {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalPrice = 0;

            cart.forEach(item => {
                totalPrice += item.price * item.quantity;
            });

            let totalAmount = parseFloat(document.getElementById('totalAmount').textContent);

            let paymentMethode = document.getElementById('paymentMethode').value;

            let dataOrder = {
                total_price: totalPrice,
                payment_methode: paymentMethode,
                total_amount: totalAmount
            };

            fetch('http://localhost:9000/AddOrder', {
                method: 'POST',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataOrder),
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                   showSwal(`${data.message}`,`success`);
                   
                    DisplayCart();
                } else {
                    showSwal(`${data.message}`,`error`);
                }
            })
            .catch(error => console.error('Error adding order:', error));
        });
        document.getElementById('btnClearCart').addEventListener('click', async function () {
            fetch('http://localhost:9000/ClearCart',{
                method: 'delete',
                headers: { "Content-Type": "application/json" },
                credentials: 'same-origin',

            })
            .then(response => response.json())
            .then(data =>{
                if(data.success){
                    return showSwal(`${data.message}`,'success');
                }else{
                     return showSwal(`${data.message}`,'error');
                }

            })
        })

        async function removeCardItem(index) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    if (index >= 0 && index < cart.length) {
        let item = cart[index];

        // Send request to backend to delete from DB
        let response = await fetch('http://localhost:9000/DeleteCartItem', {
            method: 'DELETE',
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id_product: item.id_product
            })
        });

        let data = await response.json();

        if (data.success) {
            cart.splice(index, 1); // Remove from localStorage
            localStorage.setItem('cart', JSON.stringify(cart));
            DisplayCart();
            showSwal(data.message, 'success');
        } else {
            showSwal(data.message, 'error');
        }
    }
}


        function clearCart() {
            localStorage.removeItem('cart');
            DisplayCart();
            showSwal('cart deleted successfuly','success');
        }

        




        function showSwal(message, iconType) {
    Swal.fire({
        icon: iconType, 
        title: iconType === 'success' ? 'Success' : 'Error',
        text: message,
        timer: 7000,
        timerProgressBar: true,
        showConfirmButton: false,
        position: 'top',
    });
}
